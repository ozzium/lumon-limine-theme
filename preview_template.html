<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Lumon Industries Limine Bootloader Preview</title>
  <style>
    @font-face {
      font-family: 'VT323';
      src: url('./VT323-Regular.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'VT323', monospace;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #09213A;
      color: #8FE2FF;
    }

    .monitor {
      position: relative;
      width: 1920px;
      height: 1080px;
      background-image: url('./wallpaper.png');
      background-size: cover;
    }

    .limine-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    /* Limine Menu Box positioned inside the terminal frame */
    .menu-box {
      width: 960px;
      height: 380px;
      margin-top: 25px;
      padding: 24px 36px;
      background: rgba(9, 33, 58, 0.75);
      border: 1px solid rgba(143, 226, 255, 0.5);
      box-shadow: inset 0 0 20px rgba(143, 226, 255, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 26px;
      letter-spacing: 2px;
    }

    .entry {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #8FE2FF;
    }

    .entry.selected {
      background: #8FE2FF;
      color: #09213A;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(143, 226, 255, 0.8);
    }

    .entry.selected .cursor-indicator {
      display: inline-block;
    }

    .cursor-indicator {
      display: none;
    }

    .limine-info-bar {
      font-size: 20px;
      color: rgba(143, 226, 255, 0.75);
      border-top: 1px dashed rgba(143, 226, 255, 0.35);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }

    .timeout-counter {
      color: #8FE2FF;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="monitor">
    <div class="limine-overlay">
      <div class="menu-box">
        <div class="entries">
          <div class="entry selected">
            <span>&gt;</span>
            <span>Omarchy Linux (Kernel 6.12.1-omarchy)</span>
            <span style="margin-left: auto; font-size: 20px;">[DEFAULT]</span>
          </div>
          <div class="entry">
            <span>&nbsp;</span>
            <span>Omarchy Linux (fallback initramfs)</span>
          </div>
          <div class="entry">
            <span>&nbsp;</span>
            <span>Snapper Root Snapshots (Btrfs recovery)</span>
          </div>
          <div class="entry">
            <span>&nbsp;</span>
            <span>UEFI Firmware Settings / BIOS Setup</span>
          </div>
        </div>

        <div class="limine-info-bar">
          <span>Limine Bootloader v8.x &bull; Press 'e' to edit command line &bull; 'c' for console</span>
          <span>Auto-boot in <span class="timeout-counter">00:08s</span></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
